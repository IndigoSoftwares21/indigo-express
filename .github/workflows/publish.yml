name: Publish

# Stages a release on every push to main, but only when the version in
# package.json isn't already on npm. Bumping the version in a PR is the
# release signal — it gets reviewed with the code, and merging stages it.
#
# This does NOT make the package live by itself. `npm stage publish` creates
# a staged release that a maintainer must explicitly approve with 2FA — via
# `npm stage approve <package>@<version>` (after `npm login`) or on the
# package's npmjs.com page — before it's actually published. That approval
# step can't be automated: npm requires interactive proof-of-presence for it,
# on purpose, so a compromised CI run can stage a bad release but can never
# make it live on its own.
#
# Auth is npm trusted publishing (OIDC): no token is stored in this repo, and
# none is exposed to the runner. GitHub mints a short-lived credential that npm
# verifies against the publisher configured on the package, so there is nothing
# for a malicious dependency to read out of the environment.
#
# Configure it once at npmjs.com → the package → Settings → Trusted Publisher:
#   Provider:   GitHub Actions
#   Repository: IndigoSoftwares21/indigo-express
#   Workflow:   publish.yml
on:
  push:
    branches: [main]
  # Lets a failed publish be re-run without an empty commit.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Pushes the release tag after a successful publish.
      contents: write
      # Mints the OIDC token. Without this the publish falls back to looking for
      # a token and fails.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1+; Node 22 still ships npm 10.
      - run: npm install -g npm@latest

      # Is this version already out? `npm view` exits non-zero for a version
      # that doesn't exist, which is exactly the signal we want.
      - name: Check whether this version is published
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "indigo-express@$VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "indigo-express@$VERSION is already on npm — nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "indigo-express@$VERSION is new — staging it for release."
          fi

      - if: steps.check.outputs.published == 'false'
        run: npm ci --ignore-scripts

      # No typecheck/build step: the root package (bin/indigo-express.js) is
      # plain JS with nothing to compile.
      - if: steps.check.outputs.published == 'false'
        run: npm test

      # Stages the release — this does not make it public. A maintainer must
      # separately approve it with 2FA (see the header comment above) before
      # anyone can actually install this version.
      # --provenance publishes a signed attestation linking the tarball to this
      # commit and workflow, which npm shows on the package page once approved.
      - if: steps.check.outputs.published == 'false'
        run: npm stage publish --provenance --access public

      # Tags once staging succeeds, not once it's actually live — approval
      # happens outside CI and this workflow has no way to know when (or
      # whether) that happens. The tag marks "staged for this version",
      # matching what actually just happened in this job.
      - if: steps.check.outputs.published == 'false'
        name: Tag the staged release
        run: |
          git tag "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"

      - if: steps.check.outputs.published == 'false'
        name: Print next step
        run: |
          echo "Staged indigo-express@${{ steps.check.outputs.version }}."
          echo "Approve it with 2FA to publish: npm stage approve indigo-express@${{ steps.check.outputs.version }} (after npm login), or via the package page on npmjs.com."
